name: GW3 Discord Timer

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # The news checker's state lives in the Actions cache, not in git. Committing it every four
      # hours put 170-plus "Update GW3 news checker state" commits on main and left every checkout
      # drifting behind. The tracked news-state.json is the seed for a cold cache only.
      - name: Restore news checker state
        uses: actions/cache/restore@v4
        with:
          path: news-state.json
          key: gw3-news-state-${{ github.run_id }}
          restore-keys: |
            gw3-news-state-

      - name: Check official Guild Wars site and post countdown
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.GW3_DISCORD_WEBHOOK_URL }}
        run: node github-action-post.mjs

      - name: Save news checker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news-state.json
          key: gw3-news-state-${{ github.run_id }}
